document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

{\n  height: 2px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8 ndroid development<\u002Fdiv>\n          <p class=\"card-body\">Desktop application development alongside Android, for teams that need software running outside the browser too.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"card elev-sm\" style=\"gap:12px;\">\n          <i data-lucide=\"network\" style=\"width:20px;height:20px;color:var(--color-accent);\"><\u002Fi>\n          <div class=\"card-kicker\">INFRA<\u002Fdiv>\n          <div class=\"card-title\">Messaging, networking &amp; troubleshooting<\u002Fdiv>\n          <p class=\"card-body\">Managing Kafka and MQTT servers, plus general networking and troubleshooting to keep systems talking to each other.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- WORK -->\n    <section id=\"work\" ref=\"{{ workRef }}\" style=\"{{ workReveal }}padding:clamp(48px,7vw,80px) 0;border-top:2px solid var(--color-divider);\">\n      <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:10px;\">\n        <span style=\"font-size:12px;color:var(--color-accent);font-weight:600;\">04 /<\u002Fspan>\n        <h2 style=\"font-size:27px;margin:0;\">Things I've built<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"color:var(--color-neutral-700);max-width:600px;margin:0 0 34px;\">A selection of what I've shipped and what's currently in progress.<\u002Fp>\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px;\">\n        <div class=\"card elev-sm\" style=\"gap:14px;padding:24px;\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;\">\n            <span class=\"tag tag-accent\" style=\"display:inline-flex;align-items:center;gap:6px;\"><span style=\"width:5px;height:5px;border-radius:50%;background:currentColor;\"><\u002Fspan>live · production<\u002Fspan>\n            <span style=\"font-size:11px;color:var(--color-neutral-600);\">private repo<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"card-title\ an><span class=\"tag tag-neutral\">CRM leads<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"card elev-sm\" style=\"gap:14px;padding:24px;\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;\">\n            <span class=\"tag tag-outline\" style=\"display:inline-flex;align-items:center;gap:6px;\"><span style=\"width:5px;height:5px;border-radius:50%;background:currentColor;\"><\u002Fspan>in rebuild<\u002Fspan>\n            <a href=\"https://akkaprints.com\" target=\"_blank\" rel=\"noopener\" style=\"font-size:11px;text-decoration:none;\">akkaprints.com ↗<\u002Fa>\n          <\u002Fdiv>\n          <div class=\"card-title\" style=\"font-size:19px;\">AkkaPrints<\u002Fdiv>\n          <p class=\"card-body\" style=\"font-size:14px;\">Web-to-print platform with a Fabric.js canvas design editor, currently being rebuilt from scratch as a clean WooCommerce architecture — the design editor split out into its own standalone plugin.<\u002Fp>\n          <div style=\"display:flex;flex-wrap:wrap;gap:6px;\">\n            <span class=\"tag tag-neutral\">WooCommerce<\u002Fspan><span class=\"tag tag-neutral\">Fabric.js<\u002Fspan><span class=\"tag tag-neutral\">PHP<\u002Fspan><span class=\"tag tag-neutral\">Custom plugins<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"card elev-sm\" style=\"gap:14px;padding:24px;\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;\">\n            <span class=\"tag tag-accent\" style=\"display:inline-flex;align-items:center;gap:6px;\"><span style=\"width:5px;height:5px;border-radius:50%;background:currentColor;\"><\u002Fspan>live<\u002Fspan>\n            <span style=\"font-size:11px;color:var(--color-neutral-600);\">utility tool<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"card-title\" style=\"font-size:19px;\">Upbhulekh Calculator<\u002Fdiv>\n          <p class=\"card-body\" style=\"font-size:14px;\">A calculator utility built around Uttar Pradesh's Bhulekh land-record system — one of the earlier tools I built and shipped independently.<\u002Fp>\n          <div style=\"display:flex;flex-wrap:wrap;gap:6px;\">\n            <span class=\"tag tag-neutral\">Utility software<\u002Fspan><span class=\"tag tag-neutral\">Independent build<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ABOUT -->\n    <section id=\"about\" ref=\"{{ aboutRef }}\" style=\"{{ aboutReveal }}padding:clamp(48px,7vw,80px) 0;border-top:2px solid var(--color-divider);\">\n      <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:34px;\">\n        <span style=\"font-size:12px;color:var(--color-accent);font-weight:600;\">05 /<\u002Fspan>\n        <h2 style=\"font-size:27px;margin:0;\">About<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:minmax(280px,1.3fr) minmax(240px,1fr);gap:48px;\">\n        <div>\n          <p style=\"color:var(--color-neutral-700);font-size:15.5px;margin:0 0 18px;\">I've been working in software since <b style=\"color:var(--color-text);\">2016<\u002Fb>, and I run two ventures — <b style=\"color:var(--color-text);\">InstrumentGuru<\u002Fb> and <b style=\"color:var(--color-text);\">Chairy Foundation<\u002Fb> — where I handle software design, solutioning, support, and upgrades for clients end to end.<\u002Fp>\n          <p style=\"color:var(--color-neutral-700);font-size:15.5px;margin:0 0 18px;\">My background sits at the intersection of IT and industrial systems: an <b style=\"color:var(--color-text);\">MBA in IT and Administration<\u002Fb>, a bachelor's degree in <b style=\"color:var(--color-text);\">Computer Science<\u002Fb>, and hands-on time with <b style=\"color:var(--color-text);\">control &amp; instrumentation<\u002Fb> — PLC and DCS software included. I'm an <b style=\"color:var(--color-text);\">ex-TCS<\u002Fb> employee and an <b style=\"color:var(--color-text);\">ex-KNITian<\u002Fb> (Kamla Nehru Institute of Technology), where I was also a member of the <b style=\"color:var(--color-text);\">KNIT Developer Club<\u002Fb>.<\u002Fp>\n          <p style=\"color:var(--color-neutral-700);font-size:15.5px;margin:0 0 18px;\">I keep learning deliberately — a steady stream of Udemy courses to stay current — and I like taking on work across the stack: databases, Python/Django/Node.js backends, Android and desktop apps, embedded and modern IoT development, and the Kafka/MQTT infrastructure that ties it together.<\u002Fp>\n          <p style=\"color:var(--color-neutral-700);font-size:15.5px;margin:0;\">I also go by <b style=\"color:var(--color-text);\">Vineet Maurya<\u002Fb> as a personal brand name across some of my earlier work — same person, same GitHub.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border:1px solid var(--color-divider);padding:4px 20px;align-self:start;\">\n          <div style=\"display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid var(--color-divider);font-size:13.5px;\"><span style=\"color:var(--color-neutral-600);font-size:11px;text-transform:uppercase;letter-spacing:0.03em;\">Org<\u002Fspan><span style=\"text-align:right;font-weight:600;\">InstrumentGuru &amp; Chairy Foundation<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid var(--color-divider);font-size:13.5px;\"><span style=\"color:var(--color-neutral-600);font-size:11px;text-transform:uppercase;letter-spacing:0.03em;\">Role<\u002Fspan><span style=\"text-align:right;font-weight:600;\">Design, solutioning &amp; support<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid var(--color-divider);font-size:13.5px;\"><span style=\"color:var(--color-neutral-600);font-size:11px;text-transform:uppercase;letter-spacing:0.03em;\">Education<\u002Fspan><span style=\"text-align:right;font-weight:600;\">MBA (IT &amp; Admin), B.Sc CS<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid var(--color-divider);font-size:13.5px;\"><span style=\"color:var(--color-neutral-600);font-size:11px;text-transform:uppercase;letter-spacing:0.03em;\">Alma mater<\u002Fspan><span style=\"text-align:right;font-weight:600;\">KNIT — Dev Club member<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid var(--color-divider);font-size:13.5px;\"><span style=\"color:var(--color-neutral-600);font-size:11px;text-transform:uppercase;letter-spacing:0.03em;\">Ex-employer<\u002Fspan><span style=\"text-align:right;font-weight:600;\">TCS<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid var(--color-divider);font-size:13.5px;\"><span style=\"color:var(--color-neutral-600);font-size:11px;text-transform:uppercase;letter-spacing:0.03em;\">In software since<\u002Fspan><span style=\"text-align:right;font-weight:600;\">2016<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid var(--color-divider);font-size:13.5px;\"><span style=\"color:var(--color-neutral-600);font-size:11px;text-transform:uppercase;letter-spacing:0.03em;\">Location<\u002Fspan><span style=\"text-align:right;font-weight:600;\">Meerganj, Bareilly, UP<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;gap:16px;padding:13px 0;font-size:13.5px;\"><span style=\"color:var(--color-neutral-600);font-size:11px;text-transform:uppercase;letter-spacing:0.03em;\">GitHub<\u002Fspan><span style=\"text-align:right;font-weight:600;\">@svineet212<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n  <\u002Fdiv>\n\n  <!-- CONTACT (poster) -->\n  <footer id=\"contact\" ref=\"{{ contactRef }}\" style=\"{{ contactReveal }}background:var(--color-accent);color:var(--color-bg);margin-top:0;\">\n    <div style=\"max-width:1180px;margin:0 auto;padding:clamp(56px,9vw,100px) clamp(20px,4vw,32px) clamp(48px,7vw,72px);\">\n      <div style=\"font-size:12px;letter-spacing:0.06em;margin-bottom:16px;opacity:0.85;\">06 /<\u002Fdiv>\n      <h2 style=\"font-family:var(--font-heading);font-weight:800;font-size:clamp(32px,5vw,50px);line-height:1.04;margin:0 0 18px;max-width:640px;\">Building something?<br>Let's talk.<\u002Fh2>\n      <p style=\"max-width:480px;font-size:15px;opacity:0.92;margin:0 0 36px;\">Open to freelance projects, contract work, and anything that spans software, IoT, and control systems.<\u002Fp>\n      <div style=\"display:flex;flex-wrap:wrap;gap:14px;\">\n        <a href=\"https://github.com/svineet212\" target=\"_blank\" rel=\"noopener\" style=\"display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--color-bg);border:1.5px solid var(--color-bg);padding:12px 18px;font-size:13px;\"><i data-lucide=\"external-link\" style=\"width:15px;height:15px;\"><\u002Fi>github.com/svineet212<\u002Fa>\n        <a href=\"https://svineet212.github.io/CL_form/htpsshiftinfo.html\" target=\"_blank\" rel=\"noopener\" style=\"display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--color-bg);border:1.5px solid var(--color-bg);padding:12px 18px;font-size:13px;\"><i data-lucide=\"bar-chart-2\" style=\"width:15px;height:15px;\"><\u002Fi>Shift Chart HTPS<\u002Fa>\n        <a href=\"mailto:vineetkumarmourya@gmail.com\" style=\"display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--color-bg);border:1.5px solid var(--color-bg);padding:12px 18px;font-size:13px;\"><i data-lucide=\"mail\" style=\"width:15px;height:15px;\"><\u002Fi>vineetkumarmourya@gmail.com<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"max-width:1180px;margin:0 auto;padding:0 clamp(20px,4vw,32px);\">\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));border-top:1.5px solid var(--color-bg);\">\n        <div style=\"padding:14px 18px;border-right:1px solid color-mix(in srgb, var(--color-bg) 40%, transparent);border-bottom:1px solid color-mix(in srgb, var(--color-bg) 40%, transparent);\"><div style=\"font-size:9.5px;text-transform:uppercase;letter-spacing:0.06em;opacity:0.75;margin-bottom:5px;\">Drawn by<\u002Fdiv><div style=\"font-size:12.5px;\">Vineet Kumar<\u002Fdiv><\u002Fdiv>\n        <div style=\"padding:14px 18px;border-right:1px solid color-mix(in srgb, var(--color-bg) 40%, transparent);border-bottom:1px solid color-mix(in srgb, var(--color-bg) 40%, transparent);\"><div style=\"font-size:9.5px;text-transform:uppercase;letter-spacing:0.06em;opacity:0.75;margin-bottom:5px;\">Date<\u002Fdiv><div style=\"font-size:12.5px;\">2026<\u002Fdiv><\u002Fdiv>\n        <div style=\"padding:14px 18px;border-right:1px solid color-mix(in srgb, var(--color-bg) 40%, transparent);border-bottom:1px solid color-mix(in srgb, var(--color-bg) 40%, transparent);\"><div style=\"font-size:9.5px;text-transform:uppercase;letter-spacing:0.06em;opacity:0.75;margin-bottom:5px;\">Location<\u002Fdiv><div style=\"font-size:12.5px;\">Bareilly, UP, IN<\u002Fdiv><\u002Fdiv>\n        <div style=\"padding:14px 18px;border-bottom:1px solid color-mix(in srgb, var(--color-bg) 40%, transparent);\"><div style=\"font-size:9.5px;text-transform:uppercase;letter-spacing:0.06em;opacity:0.75;margin-bottom:5px;\">Status<\u002Fdiv><div style=\"font-size:12.5px;\">Approved for view<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n  <!-- CMD-K PALETTE -->\n  <sc-if value=\"{{ cmdOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"dialog-backdrop\" sc-camel-on-click=\"{{ closeCmd }}\" style=\"z-index:100;align-items:flex-start;padding-top:14vh;\">\n      <div class=\"dialog\" sc-camel-on-click=\"{{ stopProp }}\" style=\"width:min(560px,100%);padding:0;overflow:hidden;\">\n        <div style=\"display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:2px solid var(--color-divider);\">\n          <i data-lucide=\"search\" style=\"width:16px;height:16px;color:var(--color-neutral-600);\"><\u002Fi>\n          <input autofocus=\"\" type=\"text\" placeholder=\"Jump to a section or link…\" value=\"{{ cmdQuery }}\" sc-camel-on-change=\"{{ onCmdQueryChange }}\" sc-camel-on-key-down=\"{{ onCmdKeyDown }}\" style=\"flex:1;border:none;outline:none;background:transparent;font-family:var(--font-body);font-size:15px;color:var(--color-text);\">\n          <span style=\"font-size:10px;color:var(--color-neutral-600);border:1px solid var(--color-divider);padding:2px 6px;\">ESC<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"max-height:360px;overflow:auto;\">\n          <sc-for list=\"{{ cmdResults }}\" as=\"item\" hint-placeholder-count=\"5\">\n            <div sc-camel-on-click=\"{{ item.onSelect }}\" style=\"{{ item.rowStyle }}\">\n              <i data-lucide=\"{{ item.icon }}\" style=\"width:15px;height:15px;color:var(--color-accent);flex:none;\"><\u002Fi>\n              <span style=\"flex:1;font-size:14px;\">{{ item.label }}<\u002Fspan>\n              <span style=\"font-size:11px;color:var(--color-neutral-600);\">{{ item.hint }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ cmdEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding:26px;text-align:center;color:var(--color-neutral-600);font-size:13px;\">No matches<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst COMMANDS = [\n  {icon:'terminal', label:'Jump to top', hint:'section', kind:'scroll', target:null},\n  {icon:'boxes', label:'Stack', hint:'section', kind:'scroll', target:'stack'},\n  {icon:'code-2', label:'Live GitHub stats', hint:'section', kind:'scroll', target:'github'},\n  {icon:'layers', label:'Areas of expertise', hint:'section', kind:'scroll', target:'expertise'},\n  {icon:'hammer', label:\"Things I've built\", hint:'section', kind:'scroll', target:'work'},\n  {icon:'user', label:'About', hint:'section', kind:'scroll', target:'about'},\n  {icon:'mail', label:'Contact', hint:'section', kind:'scroll', target:'contact'},\n  {icon:'external-link', label:'GitHub profile', hint:'github.com/svineet212', kind:'link', target:'https://github.com/svineet212'},\n  {icon:'external-link', label:'Falcon Export Hub', hint:'falconexporthub.in', kind:'link', target:'https://falconexporthub.in'},\n  {icon:'external-link', label:'AkkaPrints', hint:'akkaprints.com', kind:'link', target:'https://akkaprints.com'},\n  {icon:'file-text', label:'Download résumé', hint:'opens résumé', kind:'link', target:'resume.html'},\n  {icon:'mail', label:'Email Vineet', hint:'mailto', kind:'link', target:'mailto:vineetkumarmourya@gmail.com'},\n];\n\nconst TERMINAL_SCRIPT =\n\"$ whoami\\nvineet_kumar\\n\\n\" +\n\"$ cat role.txt\\nsoftware engineer -- design, solutioning, support & upgrades\\n\\n\" +\n\"$ ps aux | grep focus\\ndatabases . web backends . modern IoT . control & instrumentation\\n\\n\" +\n\"$ echo $STATUS\\nopen_to_freelance_and_contract_work_\";\n\nclass Component extends DCLogic {\n  state = {\n    cmdOpen: false,\n    cmdQuery: '',\n    activeIndex: 0,\n    gh: { repos: null, followers: null, status: 'syncing' },\n    revealed: { stack: false, github: false, expertise: false, work: false, about: false, contact: false },\n  };\n\n  termRef = React.createRef();\n  stackRef = React.createRef();\n  githubRef = React.createRef();\n  expertiseRef = React.createRef();\n  workRef = React.createRef();\n  aboutRef = React.createRef();\n  contactRef = React.createRef();\n\n  componentDidMount() {\n    this.reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    this._setupReveal();\n    this._typeTerminal();\n    this._fetchGithub();\n    this._onKeyDown = (e) => {\n      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {\n        e.preventDefault();\n        this.setState(s => ({ cmdOpen: !s.cmdOpen, cmdQuery: '', activeIndex: 0 }));\n      } else if (e.key === 'Escape' && this.state.cmdOpen) {\n        this.closeCmd();\n      }\n    };\n    document.addEventListener('keydown', this._onKeyDown);\n    if (window.lucide) window.lucide.createIcons();\n  }\n\n  componentDidUpdate() {\n    if (window.lucide) window.lucide.createIcons();\n  }\n\n  componentWillUnmount() {\n    document.removeEventListener('keydown', this._onKeyDown);\n    if (this._observer) this._observer.disconnect();\n    if (this._typeTimer) clearTimeout(this._typeTimer);\n  }\n\n  _setupReveal() {\n    const keys = ['stack', 'github', 'expertise', 'work', 'about', 'contact'];\n    const refs = { stack: this.stackRef, github: this.githubRef, expertise: this.expertiseRef, work: this.workRef, about: this.aboutRef, contact: this.contactRef };\n    if (this.reducedMotion) {\n      this.setState({ revealed: { stack: true, github: true, expertise: true, work: true, about: true, contact: true } });\n      return;\n    }\n    this._observer = new IntersectionObserver((entries) => {\n      entries.forEach(entry => {\n        if (entry.isIntersecting) {\n          const key = keys.find(k => refs[k].current === entry.target);\n          if (key) {\n            this.setState(s => ({ revealed: { ...s.revealed, [key]: true } }));\n            this._observer.unobserve(entry.target);\n          }\n        }\n      });\n    }, { threshold: 0.15 });\n    keys.forEach(k => { if (refs[k].current) this._observer.observe(refs[k].current); });\n  }\n\n  _typeTerminal() {\n    if (!this.termRef.current) return;\n    if (this.reducedMotion) { this.termRef.current.textContent = TERMINAL_SCRIPT; return; }\n    let i = 0;\n    const step = () => {\n      if (!this.termRef.current) return;\n      i += 1;\n      this.termRef.current.textContent = TERMINAL_SCRIPT.slice(0, i);\n      if (i < TERMINAL_SCRIPT.length) {\n        this._typeTimer = setTimeout(step, 14);\n      }\n    };\n    step();\n  }\n\n  _fetchGithub() {\n    fetch('https://api.github.com/users/svineet212')\n      .then(r => (r.ok ? r.json() : Promise.reject(new Error('bad status'))))\n      .then(data => {\n        this.setState({ gh: { repos: data.public_repos, followers: data.followers, status: 'live' } });\n      })\n      .catch(() => {\n        this.setState(s => ({ gh: { ...s.gh, status: 'unavailable' } }));\n      });\n  }\n\n  scrollToSection(id) {\n    if (!id) { window.scrollTo({ top: 0, behavior: this.reducedMotion ? 'auto' : 'smooth' }); return; }\n    const el = document.getElementById(id);\n    if (!el) return;\n    const top = el.getBoundingClientRect().top + window.scrollY - 84;\n    window.scrollTo({ top, behavior: this.reducedMotion ? 'auto' : 'smooth' });\n  }\n\n  runCommand(cmd) {\n    if (cmd.kind === 'scroll') this.scrollToSection(cmd.target);\n    else if (cmd.kind === 'link') window.open(cmd.target, '_blank', 'noopener');\n    this.setState({ cmdOpen: false, cmdQuery: '' });\n  }\n\n  openCmd = () => this.setState({ cmdOpen: true, cmdQuery: '', activeIndex: 0 });\n  closeCmd = () => this.setState({ cmdOpen: false });\n  stopProp = (e) => e.stopPropagation();\n  onCmdQueryChange = (e) => this.setState({ cmdQuery: e.target.value, activeIndex: 0 });\n\n  onCmdKeyDown = (e) => {\n    const results = this._filteredCommands();\n    if (e.key === 'ArrowDown') { e.preventDefault(); this.setState(s => ({ activeIndex: Math.min(s.activeIndex + 1, results.length - 1) })); }\n    else if (e.key === 'ArrowUp') { e.preventDefault(); this.setState(s => ({ activeIndex: Math.max(s.activeIndex - 1, 0) })); }\n    else if (e.key === 'Enter') { e.preventDefault(); if (results[this.state.activeIndex]) this.runCommand(results[this.state.activeIndex]); }\n  };\n\n  _filteredCommands() {\n    const q = this.state.cmdQuery.trim().toLowerCase();\n    if (!q) return COMMANDS;\n    return COMMANDS.filter(c => c.label.toLowerCase().includes(q) || c.hint.toLowerCase().includes(q));\n  }\n\n  _revealStyle(key) {\n    const on = this.state.revealed[key];\n    const base = 'transition:opacity .6s ease, transform .6s ease;';\n    return on ? base + 'opacity:1;transform:translateY(0);' : base + 'opacity:0;transform:translateY(18px);';\n  }\n\n  renderVals() {\n    const results = this._filteredCommands().map((c, i) => ({\n      icon: c.icon,\n      label: c.label,\n      hint: c.hint,\n      onSelect: () => this.runCommand(c),\n      rowStyle: `display:flex;align-items:center;gap:12px;padding:12px 18px;cursor:pointer;background:${i === this.state.activeIndex ? 'var(--color-accent-100)' : 'transparent'};border-bottom:1px solid var(--color-divider);`,\n    }));\n\n    return {\n      termRef: this.termRef,\n      stackRef: this.stackRef,\n      githubRef: this.githubRef,\n      expertiseRef: this.expertiseRef,\n      workRef: this.workRef,\n      aboutRef: this.aboutRef,\n      contactRef: this.contactRef,\n\n      stackReveal: this._revealStyle('stack'),\n      githubReveal: this._revealStyle('github'),\n      expertiseReveal: this._revealStyle('expertise'),\n      workReveal: this._revealStyle('work'),\n      aboutReveal: this._revealStyle('about'),\n      contactReveal: this._revealStyle('contact'),\n\n      ghRepos: this.state.gh.repos == null ? '—' : this.state.gh.repos,\n      ghFollowers: this.state.gh.followers == null ? '—' : this.state.gh.followers,\n      ghStatusLabel: this.state.gh.status === 'syncing' ? 'syncing…' : this.state.gh.status === 'live' ? 'live' : 'cached',\n\n      cmdOpen: this.state.cmdOpen,\n      cmdQuery: this.state.cmdQuery,\n      cmdResults: results,\n      cmdEmpty: results.length === 0,\n      openCmd: this.openCmd,\n      closeCmd: this.closeCmd,\n      stopProp: this.stopProp,\n      onCmdQueryChange: this.onCmdQueryChange,\n      onCmdKeyDown: this.onCmdKeyDown,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
